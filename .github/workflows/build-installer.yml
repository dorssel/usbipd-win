---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  build:
    name: Build
    runs-on: windows-latest

    permissions:
      contents: write
      issues: read
      checks: write
      pull-requests: write
      id-token: write
      attestations: write

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          cache: true
          cache-dependency-path: |
            global.json
            '**/packages.lock.json'

      - name: Install dependencies
        run: |
          dotnet restore
          dotnet restore Installer

      - name: Build x64
        run: |
          dotnet build --configuration Release --no-restore --property:Platform=x64 `
            --binaryLogger:build-x64.binlog

      - name: Build arm64
        run: |
          dotnet build --configuration Release --no-restore --property:Platform=ARM64 --property:BuildProjectReferences=false Usbipd `
            --binaryLogger:build-arm64.binlog
          # NOTE: Only build Usbipd for arm64. All platform-independent projects have already been built.

      - name: Test (x64 only)
        run: |
          dotnet test --configuration Release --no-build --property:Platform=x64 `
            --report-spekt-junit `
            --coverage --coverage-output-format cobertura

      - name: Build x64 Installer
        run: |
          dotnet publish --configuration Release --no-build --runtime win-x64 --property:PublishProfile=x64 Usbipd --binaryLogger:publish-x64.binlog
          dotnet publish --configuration Release --no-build Usbipd.PowerShell --binaryLogger:publish-PowerShell.binlog
          dotnet build --configuration Release --no-restore --property:Platform=x64 Installer --binaryLogger:installer-x64.binlog

      - name: Build arm64 Installer
        run: |
          dotnet publish --configuration Release --no-build --runtime win-arm64 --property:PublishProfile=arm64 Usbipd --binaryLogger:publish-arm64.binlog
          dotnet build --configuration Release --no-restore --property:Platform=ARM64 Installer --binaryLogger:installer-arm64.binlog

      - name: Upload x64 Installer
        id: upload-x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: Installer/bin/x64/Release/usbipd-win_${{ env.GitVersion_MajorMinorPatch }}_x64.msi

      - name: Upload arm64 Installer
        id: upload-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: Installer/bin/arm64/Release/usbipd-win_${{ env.GitVersion_MajorMinorPatch }}_arm64.msi

      - name: Build x64 Attestation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: usbipd-win_${{ env.GitVersion_MajorMinorPatch }}_x64.msi
          subject-digest: sha256:${{ steps.upload-x64.outputs.artifact-digest }}

      - name: Build arm64 Attestation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: usbipd-win_${{ env.GitVersion_MajorMinorPatch }}_arm64.msi
          subject-digest: sha256:${{ steps.upload-arm64.outputs.artifact-digest }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          report_type: test_results
          files: TestResults/TestResults.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: TestResults/*.cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Submit Dependencies to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: advanced-security/component-detection-dependency-submission-action@b282c67b1008fde9b60da4bdfcd8849613e293b2 # v0.1.6
        with:
          detectorArgs: MSBuildBinaryLog=Enable
          detectorsFilter: MSBuildBinaryLog

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: always
