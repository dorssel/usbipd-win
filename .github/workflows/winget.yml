---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: winget

on:
  workflow_dispatch:
  release:
    types: [released]

permissions: {}

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Publish (WinGet)
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: dorssel.usbipd-win
          token: ${{ secrets.WINGET_TOKEN }}
