---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: winget

on:
  workflow_dispatch:
  release:
    types: [released]

permissions: {}

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Publish (WinGet)
        # winget-releaser uses floating version tags.
        uses: vedantmgoyal9/winget-releaser@f29ed1ffd34f91223a2aebaa71beaab0901ff9fd # v2 # zizmor: ignore[ref-version-mismatch]
        with:
          identifier: dorssel.usbipd-win
          token: ${{ secrets.WINGET_TOKEN }}
